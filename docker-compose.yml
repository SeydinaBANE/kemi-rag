services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: kemi
      POSTGRES_USER: kemi
      POSTGRES_PASSWORD: kemi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kemi -d kemi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=postgresql://kemi:kemi@db:5432/kemi
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-3}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-5}
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-64}
    volumes:
      - ./documents:/app/documents
      - cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  cache:
