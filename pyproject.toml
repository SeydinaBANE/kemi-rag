[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kemi"
version = "0.1.0"
description = "Agent RAG avec LangGraph, OpenRouter et pgvector"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openrouter>=0.2",
    "langgraph>=0.4",
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "fire>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "unstructured>=0.16",
    "pymupdf>=1.25",
    "python-multipart>=0.0",
    "cachetools>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "bandit>=1.8",
    "safety>=3.0",
    "pre-commit>=4.0",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*", "app.api.routes"]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
